{% extends 'base.html' %}

{% block title %}Register - Personal Expense Tracker{% endblock %}

{% block extra_css %}
<style>
    .auth-notification {
        padding: 1rem 1.5rem;
        border-radius: 0.5rem;
        margin-bottom: 1.5rem;
        font-weight: 500;
        display: none;
        animation: slideDown 0.3s ease;
    }
    .auth-notification.show {
        display: block;
    }
    .auth-notification.success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    .auth-notification.error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .btn-loading {
        position: relative;
        pointer-events: none;
        opacity: 0.8;
    }
    .btn-loading::after {
        content: '';
        position: absolute;
        width: 1.1rem;
        height: 1.1rem;
        top: 50%;
        right: 1rem;
        margin-top: -0.55rem;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h1>💰 Create Account</h1>
            <p>Join us to manage your finances</p>
        </div>

        <div id="registerNotification" class="auth-notification"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Choose a username" minlength="3">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password" minlength="8">
                <small>At least 8 characters</small>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password" minlength="8">
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign in here</a></p>
            <a href="{{ url_for('auth.landing') }}">Back to home</a>
        </div>
    </div>
</div>

<script>
(function() {
    var form = document.getElementById('registerForm');
    var btn = document.getElementById('registerBtn');
    var notif = document.getElementById('registerNotification');

    function showMsg(message, type) {
        notif.textContent = message;
        notif.className = 'auth-notification show ' + type;
    }

    function setLoading(loading) {
        if (loading) {
            btn.classList.add('btn-loading');
            btn.textContent = 'Creating account...';
            btn.disabled = true;
        } else {
            btn.classList.remove('btn-loading');
            btn.textContent = 'Create Account';
            btn.disabled = false;
        }
    }

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        notif.className = 'auth-notification';

        var username = document.getElementById('username').value.trim();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirm_password').value;

        // Client-side validation
        if (!username || !email || !password || !confirmPassword) {
            showMsg('All fields are required.', 'error');
            return;
        }

        if (username.length < 3) {
            showMsg('Username must be at least 3 characters.', 'error');
            return;
        }

        if (password.length < 8) {
            showMsg('Password must be at least 8 characters.', 'error');
            return;
        }

        if (password !== confirmPassword) {
            showMsg('Passwords do not match.', 'error');
            return;
        }

        if (email.indexOf('@') === -1 || email.indexOf('.') === -1) {
            showMsg('Please enter a valid email address.', 'error');
            return;
        }

        setLoading(true);
        console.log('[Register] Submitting for user:', username);

        var formData = new FormData(form);

        fetch('{{ url_for("auth.register") }}', {
            method: 'POST',
            body: formData
        })
        .then(function(response) {
            console.log('[Register] Response status:', response.status);
            return response.json().then(function(data) {
                return { status: response.status, data: data };
            });
        })
        .then(function(result) {
            console.log('[Register] Response data:', result.data);
            setLoading(false);

            if (result.status === 201 || result.data.success) {
                showMsg(result.data.message || 'Account created successfully! Redirecting to login...', 'success');
                form.reset();
                setTimeout(function() {
                    window.location.href = '{{ url_for("auth.login") }}';
                }, 1500);
            } else {
                showMsg(result.data.error || 'Registration failed. Please try again.', 'error');
            }
        })
        .catch(function(error) {
            console.error('[Register] Error:', error);
            setLoading(false);
            showMsg('A network error occurred. Please try again.', 'error');
        });
    });
})();
</script>
{% endblock %}
